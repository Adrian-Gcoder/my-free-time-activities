const words=[
{word:'cycling',pics:['cycling'],meaning:'Riding a bicycle.',action:'Hold your handlebars. Pedal on the spot.'},
{word:'ice-skating',pics:['skating'],meaning:'Moving on ice in skating boots.',action:'Stay in your space. Move your arms as if you are skating.'},
{word:'shopping',pics:['shopping'],meaning:'Buying things in shops.',action:'Pretend to carry shopping bags.'},
{word:'chatting with friends',pics:['chatting'],meaning:'Talking with friends.',action:'Turn to a partner. Pretend to have a friendly chat.'},
{word:'playing computer games',pics:['computer'],meaning:'Playing games on a computer.',action:'Pretend to use a keyboard and mouse.'},
{word:'watching TV / cartoons',pics:['tv','cartoons'],meaning:'Watching television programmes or cartoons.',action:'Pretend to hold a remote control.'},
{word:'making models',pics:['models'],meaning:'Building small copies of things.',action:'Pretend to put small model parts together.'},
{word:'reading storybooks / magazines',pics:['stories','magazines'],meaning:'Reading stories or magazines.',action:'Open an imaginary book. Turn a page.'},
{word:'listening to music',pics:['music'],meaning:'Enjoying songs or other music.',action:'Pretend to put on headphones.'},
{word:'playing board / card games',pics:['board','cards'],meaning:'Playing games with a board or cards.',action:'Move a game piece. Then pretend to hold some cards.'},
{word:'doing puzzles',pics:['puzzles'],meaning:'Solving puzzles or fitting puzzle pieces.',action:'Pretend to put a puzzle piece in the right place.'},
{word:'playing with dolls',pics:['dolls'],meaning:'Playing with toy dolls.',action:'Pretend to hold a doll.'}
];

const stages=[['Our favourite activities',3,'What is your favourite free time activity?'],['Learn the words',8,'Look at the pictures. Listen and say the phrases.'],['Miming game',6,'Look at the picture. Mime it. Guess the activity!'],['Riddle time',7,'Read the clues. Work out the activity.'],['Check the riddles',4,'Tell us your answer and the clue that helped.'],['My hobby choice',4,'What do you like doing in your free time?'],['Small quiz time',3,'Show what you know on your own.']];
const examples=[{id:0,lines:['I have two wheels.','I pedal and hold the handlebars.']},{id:2,lines:['I go to shops.','I buy things and carry them home in bags.']}];
const riddles=[{id:1,lines:['I wear special boots.','I move across the ice.']},{id:6,lines:['I put small parts together.','I build a little plane or car.']},{id:8,lines:['I put on my headphones.','I enjoy songs and sounds.']},{id:10,lines:['I find pieces that fit together.','I join them to make one picture.']},{id:3,lines:['I talk to my friends.','We listen and tell each other our news.']}];
const state={stage:0,learnWord:0,vocab:0,reveal:false,example:0,exampleReveal:false,riddle:0,riddleReveal:false,worksheet:false,choices:[],quiz:0,quizAnswers:[],preference:0};
const $=s=>document.querySelector(s),main=$('#main');
function photos(id,cls=''){return `<div class="photos ${cls}">${words[id].pics.map(k=>`<img src="${ASSETS[k]}" alt="Activity picture" draggable="false">`).join('')}</div>`}
function hobbyPhrase(i){return i===9?'playing board games':words[i].word.split(' / ')[0]}
function teacher(){return ''}
function speak(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replaceAll(' / ',' or '));u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)}
function announce(text){$('#status').textContent=text}
function go(i){state.stage=i;render();window.scrollTo(0,0)}
function intro(){return `<div class="surface"><p class="sentence">What is your favourite<br>free time activity?</p><p class="meaning">My favourite free time activity is ______.</p><p class="meaning">I like ______.</p><div class="four">${[0,7,8,10].map(i=>`<div class="picture-card">${photos(i)}</div>`).join('')}</div></div><div class="club-goals"><div><b>Name</b><span>I can name free time activities.</span></div><div><b>Solve</b><span>I can use clues to solve riddles.</span></div><div><b>Say</b><span>I can say what I like.</span></div></div>`}
function learnWords(){const id=state.learnWord;return `<span class="chip">Word ${id+1} / 12</span><div class="surface" style="margin-top:20px">${photos(id,'big-photo')}<div class="word">${words[id].word}</div><div class="row" style="justify-content:center"><button data-speak="${words[id].word}">Listen</button></div></div><div class="row between navigation"><button id="prevLearnWord" ${id===0?'disabled':''}>← Previous</button><button class="primary" id="nextLearnWord" ${id===11?'disabled':''}>Next →</button></div>`}
function mime(){return `<span class="chip">Picture ${state.vocab+1} / 12</span><button class="mime-picture surface" id="revealMime" aria-label="${state.reveal?'Hide activity name':'Reveal activity name'}" aria-expanded="${state.reveal}">${photos(state.vocab,'big-photo')}${state.reveal?`<div class="word answer-pop">${words[state.vocab].word}</div>`:''}</button><div class="row between navigation"><button id="prevPicture" ${state.vocab===0?'disabled':''}>← Previous</button>${state.reveal?`<button data-speak="${words[state.vocab].word}">Listen</button>`:''}<button id="nextPicture" ${state.vocab===11?'disabled':''}>Next →</button></div>`}
function riddleCard(c,revealed){return `<div class="surface"><div class="riddle">${c.lines.join('<br>')}</div>${revealed?`<div class="answer-pop"><div class="word">${words[c.id].word}</div>${photos(c.id,'answer-photo')}<p class="meaning">Which clue helped you?</p></div>`:''}</div>`}
function examplesView(){if(state.worksheet)return `<div class="surface"><h2>Your turn · Five riddles</h2><p class="sentence">Read → Underline → Think → Write</p><p class="meaning">1. Read each riddle and underline a helpful clue.</p><p class="meaning">2. Think, then discuss with your partner.</p><p class="meaning">3. Write each answer on your own worksheet.</p><a class="download" href="Lesson%201%20riddle.docx" download>Download worksheet</a><p><button id="backExamples">Back to examples</button></p></div>`;return `<div class="row navigation">${examples.map((c,i)=>`<button data-example="${i}" class="${state.example===i?'primary':''}">Example ${i+1}</button>`).join('')}</div>${riddleCard(examples[state.example],state.exampleReveal)}<div class="row navigation"><button class="primary" id="exampleReveal">${state.exampleReveal?'Hide answer':'Reveal answer'}</button><button id="worksheet">Your turn · Worksheet →</button></div>`}
function answers(){return `<div class="row navigation">${riddles.map((c,i)=>`<button data-riddle="${i}" class="${state.riddle===i?'primary':''}">Riddle ${i+1}</button>`).join('')}</div>${riddleCard(riddles[state.riddle],state.riddleReveal)}<div class="row navigation"><button class="primary" id="riddleReveal">${state.riddleReveal?'Hide answer':'Reveal answer'}</button><button id="nextRiddle" ${state.riddle===4?'disabled':''}>Next riddle →</button></div><p class="meaning">Check your answer. Correct it if needed.</p>`}
function choice(){return `<p class="sentence">${state.choices.length?state.choices.map(i=>'I like '+hobbyPhrase(i)+'.').join('<br>'):'I like ______.'}</p><p>Choose two different activities.</p><div class="cards choices">${words.map((w,i)=>`<button class="picture-card" data-choice="${i}" aria-pressed="${state.choices.includes(i)}">${photos(i)}<div class="label">${w.word}</div></button>`).join('')}</div><div class="row navigation"><button id="sayChoice" ${state.choices.length?'':'disabled'}>Listen to my sentences</button><button id="clearChoice">Clear choices</button></div><p class="meaning">A speaks. B points to the picture. Swap roles.</p>${teacher('每人選兩種不同活動，用兩句 I like… 表達，暫不教授連接詞。含斜線的詞彙在示範句使用第一種活動；學生也可口頭說第二種，如 card games、magazines 或 cartoons。選擇展示為個人示例，同伴須有不同選擇的自由。')}`}
const exitIds=[1,6,3,10];
function quiz(){if(state.quiz>=4){const score=state.quizAnswers.filter(x=>x.correct).length;return `<div class="surface"><h2>Small quiz time</h2><div class="score">${score} / 4</div><p>Correct answers in this round.</p><h3>Tell a club friend</h3><label for="exitPreference">Choose an activity you like.</label><p><select id="exitPreference">${words.map((w,i)=>`<option value="${i}" ${i===state.preference?'selected':''}>${w.word}</option>`).join('')}</select></p><p class="sentence" id="exitSentence">I like ${hobbyPhrase(state.preference)}.</p><p>Say it to your teacher, or write it on your quiz sheet.</p><div class="row"><button id="resetQuiz">Try a new round</button><button id="exportQuiz">Save this round</button></div></div>${teacher('這是單一畫面的四題作答結果。請先讓全班各自在紙上作答，再在投影逐題核對；如學生輪流操作，可每人重開一輪。另收一項喜好的口頭或書面答案，連同課堂配對記錄決定下課複習內容。')}`}
const id=exitIds[state.quiz],answer=state.quizAnswers[state.quiz];return `<span class="chip">Question ${state.quiz+1} / 4</span><h2>Which picture shows ${words[id].word}?</h2><div class="two">${exitIds.map((j,i)=>`<button class="quiz-photo ${answer&&(answer.id===j?(answer.correct?'correct':'wrong'):j===id?'correct':'')}" data-quiz="${j}" ${answer?'disabled':''} aria-label="Picture ${String.fromCharCode(65+i)}"><strong>${String.fromCharCode(65+i)}</strong>${photos(j)}</button>`).join('')}</div><div class="feedback ${answer&&!answer.correct?'error':''}" role="status">${answer?(answer.correct?'Correct!':'The correct answer is picture '+String.fromCharCode(65+exitIds.indexOf(id))+'.'):''}</div><button class="primary" id="nextQuiz" ${answer?'':'disabled'}>${state.quiz===3?'See results':'Next question →'}</button>${teacher('獨立作答：請先關閉 Word bank，學生在自己的 quiz sheet 記錄 A、B、C 或 D，再按圖核對。每題只計第一次選擇；四題結束後再說或寫一句喜好。')}`}

function render(){
$('#nav').innerHTML=stages.map((s,i)=>`<button data-stage="${i}" ${state.stage===i?'aria-current="step"':''}><span class="num">${i+1}</span><span>${s[0]}<small>${s[1]} min</small></span></button>`).join('');
main.innerHTML=`<div class="eyebrow">Our Free Time Club · ${state.stage+1} / 7</div><h1>${stages[state.stage][0]}</h1><p class="lead">${stages[state.stage][2]}</p>`+[intro,learnWords,mime,examplesView,answers,choice,quiz][state.stage]()+`<p id="status" role="status"></p><div class="row between navigation"><button data-stage="${state.stage-1}" ${state.stage===0?'disabled':''}>← Previous stage</button><button class="primary" data-stage="${state.stage+1}" ${state.stage===6?'disabled':''}>Next stage →</button></div>`;
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(+b.dataset.stage));
const on=(id,fn)=>{const b=$('#'+id);if(b)b.onclick=fn};
main.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));
on('prevLearnWord',()=>{state.learnWord--;render()});on('nextLearnWord',()=>{state.learnWord++;render()});
on('revealMime',()=>{state.reveal=!state.reveal;render()});

for(const [id,delta] of [['prevPicture',-1],['nextPicture',1]])on(id,()=>{state.vocab+=delta;state.reveal=false;render()});
main.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{state.example=+b.dataset.example;state.exampleReveal=false;render()});
on('exampleReveal',()=>{state.exampleReveal=!state.exampleReveal;render()});on('worksheet',()=>{state.worksheet=true;render()});on('backExamples',()=>{state.worksheet=false;render()});
main.querySelectorAll('[data-riddle]').forEach(b=>b.onclick=()=>{state.riddle=+b.dataset.riddle;state.riddleReveal=false;render()});
on('riddleReveal',()=>{state.riddleReveal=!state.riddleReveal;render()});on('nextRiddle',()=>{state.riddle++;state.riddleReveal=false;render()});
main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=+b.dataset.choice;if(state.choices.includes(i))state.choices=state.choices.filter(x=>x!==i);else if(state.choices.length<2)state.choices.push(i);else{announce('Choose two activities. Deselect one to change it.');return}render()});on('clearChoice',()=>{state.choices=[];render()});on('sayChoice',()=>speak(state.choices.map(i=>'I like '+hobbyPhrase(i)+'.').join(' ')));
main.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{const id=+b.dataset.quiz;state.quizAnswers[state.quiz]={id,correct:id===exitIds[state.quiz]};render()});on('nextQuiz',()=>{state.quiz++;render()});on('resetQuiz',()=>{state.quiz=0;state.quizAnswers=[];render()});const select=$('#exitPreference');if(select)select.onchange=()=>{state.preference=+select.value;$('#exitSentence').textContent='I like '+hobbyPhrase(state.preference)+'.'};on('exportQuiz',()=>download());
}
function download(){const csv='activity,correct\r\n'+exitIds.map((id,i)=>words[id].word+','+!!state.quizAnswers[i]?.correct).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='small-quiz-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#bank').innerHTML=words.map((w,i)=>`<div class="picture-card">${photos(i)}<div class="label">${w.word}</div></div>`).join('');$('#boardBtn').onclick=()=>$('#boardDialog').showModal();$('#closeBoard').onclick=()=>$('#boardDialog').close();$('#fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{announce('Use your browser full-screen view.')}};render();
</script></body></html>
